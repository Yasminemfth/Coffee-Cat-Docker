services:
  api:
    build: ./app
    ports:
      - "3000:3000"
    environment:
      PGHOST: db_coffee
      PGUSER: ${USER}
      PGPASSWORD: ${PASSWORD}
      PGDATABASE: ${DB}
    depends_on:
      - db_coffee

  db_coffee:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${USER}
      POSTGRES_PASSWORD: ${PASSWORD}
      POSTGRES_DB: ${DB}
    volumes:
      - donnee_coffee:/var/lib/postgresql

  adminer:
    image: adminer:5
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db_coffee
    depends_on:
      - db_coffee

volumes:
  donnee_coffee:
