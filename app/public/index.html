<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Cat </title>
</head>
<body>
    <h1>Bienvenue chez Coffee Cat ♥ </h1>
    
    <table>
        <thead>
            <h1>Rencontrer nos chats</h1>
            <tr>
                <th>Boubouille</th>
                <th>Numéro</th>
                <th>Nom</th>
                <th>Personalité</th>
            </tr>
        </thead>
        <tbody id="coffee-table-body">
            <!-- Coffee data will be populated here -->
        </tbody>

        <form id="coffee-form">
            <h2>Faire une réservation</h2>

            <fieldset>
            <legend>Choisissez les caractéristiques de votre petit monstre&nbsp;:</legend>

            <div>
                <input type="checkbox" id="bobby" name="bobby" checked />
                <label for="bobby">Bobby</label>
            </div>

            <div>
                <input type="checkbox" id="caramel" name="caramel" />
                <label for="caramel">Caramel</label>
            </div>

            <div>
                <input type="checkbox" id="chips" name="chips" />
                <label for="chips">Chips</label>
            </div>

            <div>
                <input type="checkbox" id="jazzon" name="jazzon" />
                <label for="jazzon">Jazzon</label>  
            </div>

            <div>
                <input type="checkbox" id="minou" name="minou" />
                <label for="minou">Minou</label>
            </div>

            <div>
                <input type="checkbox" id="neige" name="neige" />
                <label for="neige">Neige</label>
            </div>

            <div>
                <input type="checkbox" id="reglisse" name="reglisse" />
                <label for="reglisse">Réglisse</label>
            </div>
            </fieldset>


            <label for="number">Nombre de personnes:</label>
            <input type="number" id="number" name="number" required><br><br>

            <label for="date">Date:</label>
            <input type="date" id="date" name="date" required><br><br>
            
            <label for="name">Nom:</label>
            <input type="text" id="name" name="name" placeholder="Nom" required><br><br>

            <label for="surname">Prénom:</label>
            <input type="text" id="surname" name="surname" placeholder="Prénom" required><br><br>

            <button type="submit">Réserver</button>
        </form>

    <script>
    // Affiche les chats à choisir (cocher)
    async function chargerChats() {
        const zone = document.getElementById("chats");
        const chats = await fetch("/api/chats").then((r) => r.json());
        zone.innerHTML = "";
        for (const c of chats) {
        const carte = document.createElement("label");
        carte.className = "chat";
        carte.innerHTML = `
            <img src="${c.image}" alt="${c.nom}">
            <span><input type="checkbox" name="cat" value="${c.nom}"> ${c.nom}</span>`;
        zone.appendChild(carte);
        }
    }

    async function rafraichir() {
        const etat = document.getElementById("etat");
        const liste = document.getElementById("liste");
        try {
        const sante = await fetch("/api/sante").then((r) => r.json());
        etat.textContent = "Base : " + sante.base;
        etat.className = "etat " + (sante.base === "connectée" ? "ok" : "ko");
        document.getElementById("conteneur").textContent = sante.conteneur;

        const reponse = await fetch("/api/reservations");
        if (!reponse.ok) {
            liste.innerHTML = '<tr><td colspan="6">Pas de base de données : rien à afficher pour l\'instant.</td></tr>';
            return;
        }
        const reservations = await reponse.json();
        liste.innerHTML = "";
        for (const r of reservations) {
            const ligne = document.createElement("tr");
            for (const valeur of [r.cat.join(", "), r.numtable, r.nbrpers, r.date, r.nom, r.prenom]) {
            const cellule = document.createElement("td");
            cellule.textContent = valeur;
            ligne.appendChild(cellule);
            }
            liste.appendChild(ligne);
        }
        } catch {
        etat.textContent = "API injoignable";
        etat.className = "etat ko";
        }
    }

    document.getElementById("formulaire").addEventListener("submit", async (e) => {
        e.preventDefault();
        const message = document.getElementById("message");
        const f = new FormData(e.target);

        const donnees = {
        cat: f.getAll("cat"),               // tt les chats en liste
        numtable: Number(f.get("numtable")),
        nbrpers: Number(f.get("nbrpers")),
        date: f.get("date"),
        nom: f.get("nom"),
        prenom: f.get("prenom"),
        };

        if (donnees.cat.length === 0) {
        message.textContent = "Choisis au moins un chat.";
        return;
        }

        const reponse = await fetch("/api/reservations", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(donnees),
        });
        if (reponse.ok) {
        message.textContent = "";
        e.target.reset();
        } else {
        const erreur = await reponse.json();
        message.textContent = "Impossible d'enregistrer : " + erreur.erreur;
        }
        rafraichir();
    });

    chargerChats();
    rafraichir();
    setInterval(rafraichir, 3000);
    </script>   

</body>
</html>
