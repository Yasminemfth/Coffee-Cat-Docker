<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Cat </title>
</head>
<body>
    <h1>Bienvenue chez Coffee Cat ♥ </h1>
    
    <table>
        <thead>
            <h1>Rencontrer nos chats</h1>
            <tr>
                <th>Boubouille</th>
                <th>Numéro</th>
                <th>Nom</th>
                <th>Personalité</th>
            </tr>
        </thead>
        <tbody id="coffee-table-body">
            <!-- Coffee data will be populated here -->
        </tbody>

        <form id="coffee-form">
            <h2>Ajouter un nouveau chat</h2>
            <label for="number">Numéro:</label>
            <input type="text" id="number" name="number" required><br><br>

            <label for="name">Nom:</label>
            <input type="text" id="name" name="name" required><br><br>

            <label for="personality">Personalité:</label>
            <input type="text" id="personality" name="personality" required><br><br>

            <button type="submit">Ajouter</button>
        
    
</body>
</html>
